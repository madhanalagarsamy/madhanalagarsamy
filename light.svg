<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="380" viewBox="0 0 1180 380" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace" role="img" aria-label="Madhan Alagarsamy — profile.sh --live">
  <defs>
    <!-- Accent animated gradient for light theme -->
    <linearGradient id="accentLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0284C7">
        <animate attributeName="stop-color" values="#0284C7;#7C3AED;#059669;#0284C7" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#7C3AED">
        <animate attributeName="stop-color" values="#7C3AED;#059669;#0284C7;#7C3AED" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#059669">
        <animate attributeName="stop-color" values="#059669;#0284C7;#7C3AED;#059669" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Radar sweep gradient -->
    <linearGradient id="radarGradLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0891B2" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="panelGradLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F1F5F9"/>
    </linearGradient>

    <filter id="glowSubtleLight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="winClipLight">
      <rect x="2" y="2" width="1176" height="376" rx="16"/>
    </clipPath>
  </defs>

  <!-- Window Container -->
  <rect x="2" y="2" width="1176" height="376" rx="16" fill="#FFFFFF" stroke="#0891B2" stroke-width="1.2" stroke-opacity="0.3"/>

  <g clip-path="url(#winClipLight)">
    <rect x="2" y="2" width="1176" height="376" fill="url(#panelGradLight)"/>

    <!-- Subtle Tech Grid -->
    <g stroke="rgba(15, 23, 42, 0.04)" stroke-width="1">
      <line x1="0" y1="90" x2="1180" y2="90"/>
      <line x1="0" y1="140" x2="1180" y2="140"/>
      <line x1="0" y1="190" x2="1180" y2="190"/>
      <line x1="0" y1="240" x2="1180" y2="240"/>
      <line x1="0" y1="290" x2="1180" y2="290"/>
      <line x1="0" y1="340" x2="1180" y2="340"/>
      <line x1="100" y1="46" x2="100" y2="380"/>
      <line x1="250" y1="46" x2="250" y2="380"/>
      <line x1="400" y1="46" x2="400" y2="380"/>
      <line x1="550" y1="46" x2="550" y2="380"/>
      <line x1="700" y1="46" x2="700" y2="380"/>
      <line x1="850" y1="46" x2="850" y2="380"/>
      <line x1="1000" y1="46" x2="1000" y2="380"/>
    </g>

    <!-- Header / Titlebar -->
    <rect x="2" y="2" width="1176" height="42" fill="#E2E8F0"/>
    <line x1="2" y1="44" x2="1178" y2="44" stroke="rgba(15,23,42,0.08)"/>

    <!-- Terminal Controls -->
    <circle cx="28" cy="23" r="5.5" fill="#ff5f56"/>
    <circle cx="48" cy="23" r="5.5" fill="#ffbd2e"/>
    <circle cx="68" cy="23" r="5.5" fill="#27c93f"/>

    <text x="590" y="27" text-anchor="middle" font-size="12" fill="#475569" letter-spacing="1">madhan@netcorporation ~ % ./profile.sh --live</text>

    <!-- LEFT PANEL: Security Radar / Shield Visual -->
    <g transform="translate(45, 75)">
      <!-- Radar Box Container -->
      <rect x="0" y="0" width="260" height="265" rx="10" fill="#FFFFFF" stroke="rgba(8,145,178,0.25)" stroke-width="1.5"/>
      <text x="16" y="26" font-size="10" letter-spacing="2" fill="#64748B" font-weight="bold">TARGET.RADAR // 0xSEC</text>

      <!-- Center Radar Circles -->
      <g transform="translate(130, 140)">
        <!-- Static Rings -->
        <circle cx="0" cy="0" r="85" fill="none" stroke="rgba(8,145,178,0.15)" stroke-width="1"/>
        <circle cx="0" cy="0" r="60" fill="none" stroke="rgba(8,145,178,0.2)" stroke-width="1"/>
        <circle cx="0" cy="0" r="35" fill="none" stroke="rgba(8,145,178,0.3)" stroke-width="1"/>
        <circle cx="0" cy="0" r="10" fill="none" stroke="rgba(8,145,178,0.4)" stroke-width="1"/>

        <!-- Crosshairs -->
        <line x1="-90" y1="0" x2="90" y2="0" stroke="rgba(8,145,178,0.25)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="0" y1="-90" x2="0" y2="90" stroke="rgba(8,145,178,0.25)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- Rotating Radar Beam -->
        <g>
          <path d="M0 0 L 60 -60 A 85 85 0 0 1 85 0 Z" fill="url(#radarGradLight)" opacity="0.5"/>
          <line x1="0" y1="0" x2="85" y2="0" stroke="#0891B2" stroke-width="1.5"/>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
        </g>

        <!-- Threat Blips -->
        <circle cx="38" cy="-28" r="3" fill="#059669">
          <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="-42" cy="35" r="3.5" fill="#0891B2">
          <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/>
        </circle>
        <circle cx="15" cy="50" r="2.5" fill="#7C3AED">
          <animate attributeName="opacity" values="0.8;0.1;0.8" dur="1.8s" repeatCount="indefinite"/>
        </circle>
      </g>

      <!-- Radar Footer Status -->
      <text x="130" y="248" text-anchor="middle" font-size="10" fill="#059669" font-weight="bold" letter-spacing="1.5">● SHIELD STATUS: ARMED</text>
    </g>

    <!-- RIGHT PANEL: Live Interactive Terminal Spec -->
    <g transform="translate(345, 75)">
      <!-- Command prompt -->
      <text x="0" y="24" font-size="14" fill="#475569">
        <tspan fill="#0891B2">madhan@netcorp</tspan><tspan fill="#94A3B8">:</tspan><tspan fill="#7C3AED">~</tspan><tspan fill="#0F172A">$</tspan> whoami
      </text>

      <!-- Main Name with Animated Gradient -->
      <text x="0" y="68" font-size="32" font-weight="bold" fill="url(#accentLight)" filter="url(#glowSubtleLight)" letter-spacing="1">
        Madhan Alagarsamy
      </text>

      <!-- Subtitle -->
      <text x="0" y="98" font-size="14" font-weight="600" fill="#0F172A">
        Security Researcher <tspan fill="#94A3B8">|</tspan> <tspan fill="#0891B2">Founder @ Net Corporation</tspan>
      </text>

      <!-- Divider -->
      <line x1="0" y1="116" x2="780" y2="116" stroke="rgba(8, 145, 178, 0.25)" stroke-width="1"/>

      <!-- Specs & Details -->
      <g font-size="13" line-height="1.8">
        <text x="0" y="146" fill="#94A3B8">[<tspan fill="#0891B2">+</tspan>] <tspan fill="#475569">CORE FOCUS</tspan>     <tspan fill="#0F172A">:: Critical Vulnerability Research &amp; 0-Day Discovery</tspan></text>
        <text x="0" y="174" fill="#94A3B8">[<tspan fill="#0891B2">+</tspan>] <tspan fill="#475569">SPECIALTIES</tspan>    <tspan fill="#0F172A">:: Defensive Architecture • Secure Code Review • Tool Testing</tspan></text>
        <text x="0" y="202" fill="#94A3B8">[<tspan fill="#0891B2">+</tspan>] <tspan fill="#475569">ORGANIZATION</tspan>   <tspan fill="#0F172A">:: </tspan><tspan fill="#0891B2" text-decoration="underline">Net Corporation</tspan> <tspan fill="#64748B">(netcorporation.site)</tspan></text>
        <text x="0" y="230" fill="#94A3B8">[<tspan fill="#0891B2">+</tspan>] <tspan fill="#475569">AUDIT TARGETS</tspan>  <tspan fill="#7C3AED">PyTorch</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#7C3AED">TensorFlow</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#7C3AED">Keras</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#7C3AED">OpenCV</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#7C3AED">n8n</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#7C3AED">SQLite</tspan></text>

        <!-- Command Executing line with blinking cursor -->
        <text x="0" y="260" fill="#059669" font-weight="bold">
          [✓] System Integrity: Optimal <tspan fill="#94A3B8">|</tspan> Ready for secure disclosures
          <tspan fill="#0891B2">_</tspan>
          <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
        </text>
      </g>
    </g>
  </g>
</svg>
