name: Update Profile README & Metrics

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight UTC
  issues:
    types: [opened, closed, reopened, deleted]
  pull_request:
    types: [opened, closed, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-readme
  cancel-in-progress: true

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Live Metrics & Update README
        env:
          GH_USERNAME: madhanalagarsamy
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_readme.py

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update profile README & dynamic stats [skip ci]"
          file_pattern: "README.md .github/badges/*.json"
